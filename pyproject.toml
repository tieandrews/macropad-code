[project]
name = "macropad-code"
version = "0.1.0"
description = "Drive an Adafruit MacroPad RP2040's per-key LEDs from Claude Code / Codex CLI agent status"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
autodetect = ["adafruit-board-toolkit>=1.1.0"]
# For config/usage.yaml's `source: claude_pty` (experimental) -- turns the
# raw ANSI terminal stream from a driven `claude` process into readable
# text. See macropad/usage_pty.py.
pty = ["pyte>=0.8.1"]
# For config/bridge.yaml's `voice.enabled: true` (experimental) -- press
# the encoder to record from the mic and transcribe locally. Also needs
# the system-level PortAudio library (`sudo apt install libportaudio2` on
# Debian/Ubuntu/WSL; bundled already on most other platforms). See
# macropad/voice.py.
voice = ["sounddevice>=0.4", "numpy>=1.24", "faster-whisper>=1.0"]
# For `macropad-flash` -- pushes firmware/{boot.py,code.py} over the
# serial REPL instead of copying to the CIRCUITPY mass-storage drive.
# See macropad/firmware_flash.py and docs/troubleshooting.md ("Updating
# firmware over WSL/USB") for why this exists.
firmware = ["adafruit-ampy>=1.1.0"]

[project.scripts]
macropad-setup = "macropad.setup_cli:main"
macropad-bridge = "macropad.bridge:main"
macropad-sessions = "macropad.sessions:main"
macropad-flash = "macropad.firmware_flash:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["macropad*"]

[tool.setuptools.package-data]
macropad = ["services/*.template"]
