# =============================================================================
# bridge.yaml -- settings for the macropad-bridge daemon
# =============================================================================
# The bridge is the long-running background process that owns the MacroPad's
# USB serial connection. Hook scripts never talk to the serial port
# directly -- they send a tiny message to this local socket instead, which
# lets multiple agents/hooks share one connection safely.
# =============================================================================

# Loopback host/port the bridge listens on for hook messages.
# No reason to change this unless the port is already in use.
host: "127.0.0.1"
port: 9999

# Which terminal multiplexer macropad-sessions uses to run and route
# keystrokes into each configured project's agent session -- see
# docs/running-sessions.md for how the two compare and how to switch.
#   tmux    (default) -- battle-tested, works everywhere tmux does
#   herdr   -- https://herdr.dev, an agent-aware multiplexer purpose-built
#              for exactly this kind of external session orchestration
session_backend: herdr

# Serial connection to the MacroPad itself.
serial:
  baudrate: 115200
  # Seconds between reconnect attempts when the MacroPad is unplugged,
  # asleep, or not yet found.
  retry_seconds: 2

# Voice input: press-and-hold the encoder (or an action key with
# type: voice_toggle in config/keymap.yaml) to record, release to stop
# and transcribe -- classic hold-to-talk. A quick tap (release before
# hold_threshold_ms) instead leaves it recording hands-free; tap again
# to stop. Either way, transcribed text goes into the selected session.
# See macropad/stt/ and docs/customization.md. API keys go in .env
# (copy from .env.example).
voice:
  enabled: true

  # Below this held-down duration (ms), a press+release counts as a
  # "tap" (recording keeps going hands-free until a later tap stops it)
  # rather than hold-to-talk (release stops it immediately).
  hold_threshold_ms: 300

  # true (default): recording stop always sends Enter right away, same
  # as before -- transcript is submitted immediately.
  # false: recording stop types the transcript WITHOUT Enter, so you can
  # review/edit it in the session's own input box first; tap the mic
  # control again (encoder or voice_toggle key) to submit it. The mic
  # key's LED (if configured) turns amber while a transcript is pending.
  auto_enter: true

  # Backend (pick one):
  #   local_whisper       offline faster-whisper (slow on CPU, no API key)
  #   openai_whisper      OpenAI whisper-1 batch (~$0.006/min)
  #   openai_gpt4o_mini   OpenAI gpt-4o-mini-transcribe batch (~$0.003/min)
  #   openai_realtime     OpenAI gpt-realtime-whisper streaming deltas
  #   together_whisper    Together openai/whisper-large-v3 batch
  #   together_realtime   Together realtime WebSocket streaming
  backend: openai_realtime

  # local_whisper only -- tiny | base | small | medium | large-v3
  whisper_model: base

  openai:
    api_key_env: OPENAI_API_KEY
    # Batch models: whisper-1 | gpt-4o-mini-transcribe | gpt-4o-transcribe
    model: gpt-4o-mini-transcribe
    # Realtime streaming model (backend: openai_realtime)
    realtime_model: gpt-realtime-whisper
    # Latency vs accuracy for gpt-realtime-whisper:
    # minimal | low | medium | high | xhigh
    delay: medium
    language: en

  together:
    api_key_env: TOGETHER_API_KEY
    model: openai/whisper-large-v3
    language: en

  triggers:
    encoder: true   # rotary knob press toggles mic
    # Action keys use type: voice_toggle in keymap.yaml (see key 8)

# Rotary encoder rotation mode -- what turning the knob does. The
# encoder's *press* is configured above (voice.triggers.encoder) and via
# type: voice_toggle action keys; this controls what *rotating* it does.
#   session   (default) cycles which of keys 0-5 is the selected session,
#             same as always.
#   effort    rotation instead cycles the *selected* session's Claude
#             Code effort level (sends `/effort <level>`, same mechanism
#             as a cycle_effort action key -- see keymap.yaml). Keys 0-5
#             still pick which session is selected by pressing them
#             directly; only rotation is repurposed.
# Effort levels cycled through can be overridden with `effort_levels:`
# (defaults to [low, medium, high, max]).
encoder:
  rotation_mode: effort
  # effort_levels: [low, medium, high, max]

# How often (seconds) the bridge re-checks the selected session's tmux
# pane for which Claude Code model it's using, to show on the OLED's
# third line. Cheap (just a tmux pane snapshot), so this can be frequent.
model_poll_interval_seconds: 5
